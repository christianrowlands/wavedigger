version: 2
updates:
  # Keep GitHub Actions SHA pins current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # Keep npm dependencies current (security + minor/patch)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Node typings track the deploy runtime (Node 24, see engines and CI).
      # Raise this together with the runtime.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # typescript-eslint 8.x (a dependency of eslint-config-next) declares
      # typescript ">=4.8.4 <6.1.0". Remove this once typescript-eslint
      # supports TypeScript 7.
      - dependency-name: "typescript"
        versions: ["7.x"]
